<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Join Battle - TNPSC Battle Arena</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/arena.css') }}">
</head>
<body class="arena-bg">
    <div class="arena-card">
        <h2 class="arena-title">⚔️ JOIN BATTLE</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="POST">
            <input type="text" name="room_code" placeholder="ENTER ROOM CODE" maxlength="6"
                   class="room-code-input" required style="text-transform:uppercase;">
            <button type="submit" class="arena-btn">JOIN ROOM</button>
        </form>
        <a href="{{ url_for('dashboard') }}" class="back-link">← Back</a>
    </div>
</body>
</html>
