<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Choose AI Opponent - TNPSC Battle Arena</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/arena.css') }}">
</head>
<body class="arena-bg">
    <div class="arena-card">
        <h2 class="arena-title">🤖 CHOOSE YOUR AI OPPONENT</h2>
        <form method="POST" action="{{ url_for('battle_ai_start') }}">
            <input type="hidden" name="subject" value="{{ subject }}">

            <div class="ai-select-grid">
                <label class="ai-card">
                    <input type="radio" name="ai_difficulty" value="beginner" required>
                    <div class="ai-avatar">🟢</div>
                    <h3>Beginner Bot</h3>
                    <p>~55% accuracy · Slower replies</p>
                </label>

                <label class="ai-card">
                    <input type="radio" name="ai_difficulty" value="smart" required>
                    <div class="ai-avatar">🟡</div>
                    <h3>Smart Bot</h3>
                    <p>~75% accuracy · Moderate speed</p>
                </label>

                <label class="ai-card">
                    <input type="radio" name="ai_difficulty" value="master" required>
                    <div class="ai-avatar">🔴</div>
                    <h3>Master Bot</h3>
                    <p>~92% accuracy · Lightning fast</p>
                </label>
            </div>

            <button type="submit" class="arena-btn">⚔️ START BATTLE</button>
        </form>
        <a href="{{ url_for('subject_select', group='group1') }}" class="back-link">← Back</a>
    </div>
</body>
</html>
